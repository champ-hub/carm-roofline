[project]
name = "carm-roofline"
version = "1.0.7"
description = "CARM: Cache-Aware Roofline Model benchmarking and visualization toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "CHaMP Team"}
]
keywords = ["benchmark", "roofline", "performance", "hpc", "cache", "simd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "rich>=14.3.2",
    "rich-argparse>=1.7.0",
    "matplotlib>=3.7.2",
    "pandas>=2.3.3",
    "tomli>=2.0.0",
    "platformdirs>=4.0.0",
    "argcomplete>=3.0.0",
]

[project.optional-dependencies]
# GUI/visualization dependencies
gui = [
    "dash>=4.4.1",
    "dash-bootstrap-components>=2.0.4",
    "plotly>=6.7.0",
]

# Development tools
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.14",
    "pre-commit>=4.3.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.2.2",
]

# All optional dependencies combined
all = [
    "carm-roofline[gui,dev]",
]

[project.scripts]
carm = "carm_roofline.carm:main"

[project.urls]
Homepage = "https://github.com/champ-hub/carm-roofline"
Repository = "https://github.com/champ-hub/carm-roofline"
Issues = "https://github.com/champ-hub/carm-roofline/issues"

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carm_roofline", "carm_roofline.*"]
[tool.setuptools.package-data]
"carm_roofline.architecture" = ["tests/**/*.c", "tests/**/*.h"]
"carm_roofline.test_bench" = ["test_bench.c", "test_bench.h", "wrapper.inl"]
"carm_roofline.gui" = ["assets/*"]
"carm_roofline.paraver" = ["configs/*.cfg"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "test",  # Test code with temporary workarounds
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting (isort)
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # flake8-comprehensions
    "Q",      # flake8-quotes
    "RUF",    # ruff-specific rules
    "W",      # pycodestyle warnings
    "N803",   # invalid-argument-name
    "N804",   # invalid-first-argument-name-for-class-method
    "UP",     # pyupgrade
    "A",      # flake8-builtins
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN003", # banned-import-from
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RSE",    # flake8-raise
    "RET504", # unnecessary-assign
    "SIM",    # flake8-simplify
    "TID251", # banned-api
    "PLE",    # Pylint Error
    "PLW",    # Pylint Warning
    # "COM",    # flake8-commas
    # "TD",     # flake8-todos
    # "PLC",    # Pylint Convention
]

[tool.ruff.lint.isort]
# Configure import sorting to match common Python conventions
known-first-party = ["carm_roofline"]
force-single-line = false  # Allow grouped imports for readability
combine-as-imports = true  # Combine "as" imports on same line

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-r N", # no summary
    "--strict-markers",
    "--strict-config",
]

# Test markers for filtering
markers = [
    "unit: Fast unit tests for individual components",
    "integration: Tests involving multiple components or I/O",
    "slow: Long-running tests (e.g., full benchmark suites)",
    "golden: Tests comparing against golden reference outputs",
    "x86: Tests specific to x86 architecture",
    "arm: Tests specific to ARM architecture",
    "riscv: Tests specific to RISC-V architecture",
]

[tool.mypy]
python_version = "3.9"
strict = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
cache_fine_grained = true
warn_unused_configs = true
exclude_gitignore = true
exclude = [
    "test/",
]

[[tool.mypy.overrides]]
module = ["dash_bootstrap_components.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "plotly.*",
]
ignore_missing_imports = true
